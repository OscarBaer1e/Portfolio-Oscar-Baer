<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Permissions Firestore</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .error {
            color: #f44336;
            background: #3a1a1a;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success {
            color: #4CAF50;
            background: #1a3a1a;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .info {
            color: #2196F3;
            background: #1a1a3a;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        pre {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔒 Test des Permissions Firestore</h1>
    
    <div class="test-section">
        <h2>1. Vérification Firebase</h2>
        <button onclick="testFirebaseInit()">Tester l'initialisation Firebase</button>
        <div id="init-result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Test de Lecture (READ)</h2>
        <button onclick="testRead()">Tester la lecture</button>
        <div id="read-result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Test d'Écriture (CREATE)</h2>
        <button onclick="testCreate()">Tester l'écriture</button>
        <div id="create-result"></div>
    </div>
    
    <div class="test-section">
        <h2>4. Test Complet</h2>
        <button onclick="testAll()">Tester tout</button>
        <div id="all-result"></div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCeZAZ6wQDqZ7ttzAt6VtvON5DDl1M5HSM",
            authDomain: "oscar-baer.firebaseapp.com",
            projectId: "oscar-baer",
            storageBucket: "oscar-baer.firebasestorage.app",
            messagingSenderId: "419618942184",
            appId: "1:419618942184:web:60e8e58c6c3348a3fbad5d"
        };
        
        let app, db;
        
        function log(elementId, message, type = 'info') {
            const div = document.getElementById(elementId);
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            div.innerHTML = `<div class="${className}">${message}</div>`;
        }
        
        function testFirebaseInit() {
            try {
                if (typeof firebase === 'undefined') {
                    log('init-result', '❌ Firebase SDK non chargé', 'error');
                    return;
                }
                
                app = firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                
                const projectId = app.options.projectId;
                if (projectId !== 'oscar-baer') {
                    log('init-result', `❌ Project ID incorrect: ${projectId} (attendu: oscar-baer)`, 'error');
                    return;
                }
                
                log('init-result', `✅ Firebase initialisé<br>Project ID: ${projectId}<br>Firestore: ${db ? 'OK' : 'ERREUR'}`, 'success');
            } catch (error) {
                log('init-result', `❌ Erreur: ${error.message}`, 'error');
            }
        }
        
        async function testRead() {
            if (!db) {
                log('read-result', '❌ Firebase non initialisé - Cliquez sur "Tester l\'initialisation Firebase" d\'abord', 'error');
                return;
            }
            
            try {
                const snapshot = await db.collection('leaderboard')
                    .limit(1)
                    .get();
                
                log('read-result', `✅ Lecture OK<br>Documents trouvés: ${snapshot.size}`, 'success');
            } catch (error) {
                let message = `❌ Erreur de lecture: ${error.code} - ${error.message}`;
                
                if (error.code === 'permission-denied') {
                    message += '<br><br>🔒 SOLUTION:<br>' +
                               '1. Allez dans Firebase Console → Firestore Database → Rules<br>' +
                               '2. Assurez-vous d\'avoir: <code>allow read: if true;</code><br>' +
                               '3. Cliquez sur "Publier" et attendez 10-20 secondes';
                }
                
                log('read-result', message, 'error');
            }
        }
        
        async function testCreate() {
            if (!db) {
                log('create-result', '❌ Firebase non initialisé - Cliquez sur "Tester l\'initialisation Firebase" d\'abord', 'error');
                return;
            }
            
            try {
                const testData = {
                    name: 'Test Permissions',
                    score: 999,
                    level: 1,
                    date: firebase.firestore.Timestamp.now()
                };
                
                const docRef = await db.collection('leaderboard').add(testData);
                
                log('create-result', `✅ Écriture OK<br>Document créé avec ID: ${docRef.id}`, 'success');
                
                // Supprimer le document de test (si les permissions le permettent)
                setTimeout(() => {
                    docRef.delete().catch(() => {
                        // Ignorer l'erreur de suppression (normal, les règles bloquent delete)
                    });
                }, 2000);
                
            } catch (error) {
                let message = `❌ Erreur d'écriture: ${error.code} - ${error.message}`;
                
                if (error.code === 'permission-denied') {
                    message += '<br><br>🔒 SOLUTION:<br>' +
                               '1. Allez dans Firebase Console → Firestore Database → Rules<br>' +
                               '2. Assurez-vous d\'avoir: <code>allow create: if true;</code><br>' +
                               '3. Cliquez sur "Publier" et attendez 10-20 secondes<br>' +
                               '4. Voir: REPARER_PERMISSIONS_FIRESTORE.md';
                }
                
                log('create-result', message, 'error');
            }
        }
        
        async function testAll() {
            const resultDiv = document.getElementById('all-result');
            resultDiv.innerHTML = '<div class="info">⏳ Test en cours...</div>';
            
            // Test 1: Initialisation
            testFirebaseInit();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Test 2: Lecture
            await testRead();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Test 3: Écriture
            await testCreate();
            
            resultDiv.innerHTML += '<div class="success">✅ Tests terminés - Vérifiez les résultats ci-dessus</div>';
        }
        
        // Auto-initialiser au chargement
        window.addEventListener('load', () => {
            testFirebaseInit();
        });
    </script>
</body>
</html>
