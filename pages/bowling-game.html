<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easter Egg - Mini Bowling | Oscar Baer</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/bowling-game.css">
    <link href="https://fonts.googleapis.com/css2?family=Anta&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Animation de fond -->
    <div class="animated-background">
        <div class="grid-lines"></div>
        <div class="floating-particles"></div>
        <div class="animated-lines"></div>
    </div>
    
    <header>
        <div class="container">
            <h1 class="logo"><a href="../index.html">Oscar BAER</a></h1>
            <nav>
                <button class="menu-toggle" aria-label="Ouvrir le menu">
                    <i class="fas fa-bars"></i>
                </button>
                <ul class="nav-list">
                    <li><a href="../index.html">Accueil</a></li>
                    <li><a href="./portfolio.html">Portfolio</a></li>
                    <li><a href="./about.html">À Propos</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="bowling-game-section" class="section-padding">
            <div class="container">
                <div class="bowling-game-container">
                    <div class="game-header">
                        <h2 class="game-title">🎳 Mini Bowling Secret 🎳</h2>
                        <div class="game-stats">
                            <div class="stat">
                                <span class="stat-label">Score:</span>
                                <span id="score" class="stat-value">0</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Lancers:</span>
                                <span id="throws" class="stat-value">0</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Meilleur:</span>
                                <span id="best-score" class="stat-value">0</span>
                            </div>
                        </div>
                        <button id="reset-game" class="btn primary-btn btn-small">Nouvelle Partie</button>
                        <a href="../index.html" class="btn secondary-btn btn-small"><i class="fas fa-home"></i> Retour</a>
                    </div>
                    
                    <div class="bowling-alley">
                        <div class="lane">
                            <div id="pins-container" class="pins-container">
                                <!-- Les quilles seront générées par JS -->
                            </div>
                            <div id="ball-container" class="ball-container">
                                <img id="bowling-ball" src="../ressources/images/1764412073317.png" alt="Boule de bowling" class="bowling-ball">
                            </div>
                        </div>
                    </div>
                    
                    <div class="game-controls">
                        <div class="power-control">
                            <label for="power-slider">Puissance:</label>
                            <input type="range" id="power-slider" min="1" max="100" value="50">
                            <span id="power-value">50%</span>
                        </div>
                        <div class="angle-control">
                            <label for="angle-slider">Angle:</label>
                            <input type="range" id="angle-slider" min="-30" max="30" value="0">
                            <span id="angle-value">0°</span>
                        </div>
                        <button id="throw-ball" class="btn primary-btn large-btn">
                            <i class="fas fa-hand-rock"></i> Lancer la Boule
                        </button>
                    </div>
                    
                    <div id="game-message" class="game-message"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="current-year-bowling"></span> Oscar Baer. Tous droits réservés.</p>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/oscar-baer-a5bbb029b/" target="_blank" aria-label="LinkedIn" class="social-link-animated"><i class="fab fa-linkedin"></i></a>
                <a href="https://github.com/OscarBaer" target="_blank" aria-label="GitHub" class="social-link-animated"><i class="fab fa-github"></i></a>
                <a href="https://twitter.com/OscarBaer" target="_blank" aria-label="Twitter" class="social-link-animated"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </footer>
    
    <script>
        document.getElementById('current-year-bowling').textContent = new Date().getFullYear();
    </script>
    <script src="../js/bowling-game.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
