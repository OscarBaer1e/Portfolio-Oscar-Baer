<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easter Egg - Mini Bowling | Oscar Baer</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/bowling-game.css">
    <link href="https://fonts.googleapis.com/css2?family=Anta&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Animation de fond -->
    <div class="animated-background">
        <div class="grid-lines"></div>
        <div class="floating-particles"></div>
        <div class="animated-lines"></div>
    </div>
    
    <header>
        <div class="container">
            <h1 class="logo"><a href="../index.html">Oscar BAER</a></h1>
            <nav>
                <button class="menu-toggle" aria-label="Ouvrir le menu">
                    <i class="fas fa-bars"></i>
                </button>
                <ul class="nav-list">
                    <li><a href="../index.html">Accueil</a></li>
                    <li><a href="./portfolio.html">Portfolio</a></li>
                    <li><a href="./about.html">À Propos</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="bowling-game-section" class="section-padding">
            <div class="container">
                <div class="bowling-game-container">
                    <div class="game-header">
                        <h2 class="game-title">🎳 Mini Bowling Secret 🎳</h2>
                        <div class="mode-selector">
                            <label for="game-mode">Mode de jeu:</label>
                            <select id="game-mode" class="mode-select">
                                <option value="solo">Solo</option>
                                <option value="1v1">1V1</option>
                            </select>
                        </div>
                        <div id="current-player" class="current-player-display">Frame 1 - Tir 1</div>
                        <div class="game-stats">
                            <div class="stat">
                                <span class="stat-label">Score:</span>
                                <span id="score" class="stat-value">0</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Frame:</span>
                                <span id="throws" class="stat-value">1</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Meilleur:</span>
                                <span id="best-score" class="stat-value">0</span>
                            </div>
                        </div>
                        <div class="header-buttons">
                            <button id="reset-game" class="btn primary-btn btn-small">Nouvelle Partie</button>
                            <a href="../index.html" class="btn secondary-btn btn-small"><i class="fas fa-home"></i> Retour</a>
                        </div>
                    </div>
                    
                    <div id="score-table-container" class="score-table-container" style="display: none;">
                        <h3 class="score-table-title">Tableau des Scores</h3>
                        <table id="score-table" class="score-table">
                            <!-- Généré par JavaScript -->
                        </table>
                    </div>
                    
                    <div class="bowling-alley">
                        <div class="lane">
                            <div class="lane-markings">
                                <div class="lane-line center-line"></div>
                                <div class="lane-line left-line"></div>
                                <div class="lane-line right-line"></div>
                                <div class="lane-arrows">
                                    <div class="arrow arrow-1"></div>
                                    <div class="arrow arrow-2"></div>
                                    <div class="arrow arrow-3"></div>
                                    <div class="arrow arrow-4"></div>
                                    <div class="arrow arrow-5"></div>
                                </div>
                            </div>
                            <div id="pins-container" class="pins-container">
                                <!-- Les quilles seront générées par JS -->
                            </div>
                            <div id="ball-container" class="ball-container">
                                <div class="ball-drag-area">
                                    <img id="bowling-ball" src="../ressources/images/1764412073317.png" alt="Boule de bowling" class="bowling-ball">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="game-controls">
                        <div class="throw-instructions">
                            <p><i class="fas fa-mouse"></i> Cliquez et glissez depuis la boule pour viser et lancer</p>
                        </div>
                    </div>
                    
                    <div id="game-message" class="game-message"></div>
                    
                    <div id="player2-image-selector" class="player2-image-selector" style="display: none;">
                        <label for="player2-image-input">Image du Joueur 2:</label>
                        <input type="file" id="player2-image-input" accept="image/*" style="display: none;">
                        <button id="select-player2-image" class="btn secondary-btn btn-small">
                            <i class="fas fa-image"></i> Choisir une image
                        </button>
                        <button id="reset-player2-image" class="btn secondary-btn btn-small">
                            <i class="fas fa-undo"></i> Image par défaut
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <!-- Canvas pour les confettis -->
    <canvas id="confetti-canvas"></canvas>

    <footer>
        <div class="container">
            <p>&copy; <span id="current-year-bowling"></span> Oscar Baer. Tous droits réservés.</p>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/oscar-baer-a5bbb029b/" target="_blank" aria-label="LinkedIn" class="social-link-animated"><i class="fab fa-linkedin"></i></a>
                <a href="https://github.com/OscarBaer" target="_blank" aria-label="GitHub" class="social-link-animated"><i class="fab fa-github"></i></a>
                <a href="https://twitter.com/OscarBaer" target="_blank" aria-label="Twitter" class="social-link-animated"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </footer>
    
    <script>
        document.getElementById('current-year-bowling').textContent = new Date().getFullYear();
    </script>
    <script src="../js/bowling-game.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
