<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easter Egg - Meme-ory | Oscar Baer</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="animated-background">
        <div class="grid-lines"></div>
        <div class="floating-particles"></div>
        <div class="animated-lines"></div>
    </div>
    
    <header>
        <div class="container">
            <h1 class="logo"><a href="../index.html">Oscar BAER</a></h1>
            <nav>
                <button class="menu-toggle" aria-label="Ouvrir le menu">
                    <i class="fas fa-bars"></i>
                </button>
                <ul class="nav-list">
                    <li><a href="../index.html">Accueil</a></li>
                    <li><a href="./portfolio.html">Portfolio</a></li>
                    <li><a href="./about.html">À Propos</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="meme-ory-section" class="section-padding">
            <div class="container">
                <div class="meme-ory-wrapper">
                    <div class="game-header">
                        <h2 class="section-title">Meme-ory Secret</h2>
                        <p class="meme-ory-intro">
                            Retrouve toutes les paires le plus vite possible.<br>
                            Les cartes sont des mèmes Ory — fais-toi plaiz.
                        </p>
                        <div class="meme-ory-stats">
                            <div class="stat">
                                <span class="stat-label">Coups</span>
                                <span id="meme-moves" class="stat-value">0</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Paires trouvées</span>
                                <span id="meme-matches" class="stat-value">0</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Temps</span>
                                <span id="meme-time" class="stat-value">0s</span>
                            </div>
                        </div>
                        <div class="meme-ory-controls">
                            <button id="meme-restart" class="btn primary-btn">Recommencer</button>
                        </div>
                    </div>

                    <div id="meme-grid" class="meme-ory-grid" aria-label="Jeu de memory des mèmes"></div>

                    <div id="meme-win-overlay" class="meme-ory-win-overlay" aria-hidden="true">
                        <div class="meme-ory-win-content">
                            <h3>GG, tu as tout trouvé !</h3>
                            <p><span id="meme-final-moves">0</span> coups — <span id="meme-final-time">0s</span></p>
                            <button id="meme-play-again" class="btn secondary-btn">Rejouer</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="current-year-meme"></span> Oscar Baer. Tous droits réservés.</p>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/oscar-baer-a5bbb029b/" target="_blank" aria-label="LinkedIn" class="social-link-animated"><i class="fab fa-linkedin"></i></a>
                <a href="https://github.com/OscarBaer" target="_blank" aria-label="GitHub" class="social-link-animated"><i class="fab fa-github"></i></a>
                <a href="https://twitter.com/OscarBaer" target="_blank" aria-label="Twitter" class="social-link-animated"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('current-year-meme').textContent = new Date().getFullYear();
    </script>
    <script src="../js/meme-ory.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
