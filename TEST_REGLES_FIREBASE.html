<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Règles Firestore - Diagnostic Complet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        .error { color: #f44336; background: #3a1a1a; padding: 10px; border-radius: 4px; margin: 10px 0; }
        .success { color: #4CAF50; background: #1a3a1a; padding: 10px; border-radius: 4px; margin: 10px 0; }
        .info { color: #2196F3; background: #1a1a3a; padding: 10px; border-radius: 4px; margin: 10px 0; }
        .warning { color: #ff9800; background: #3a2a1a; padding: 10px; border-radius: 4px; margin: 10px 0; }
        pre { background: #1a1a1a; padding: 10px; border-radius: 4px; overflow-x: auto; }
        code { background: #1a1a1a; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>🔍 Diagnostic Complet - Règles Firestore</h1>
    
    <div class="section">
        <h2>1. Informations Firebase</h2>
        <button onclick="checkFirebaseInfo()">Vérifier les informations</button>
        <div id="info-result"></div>
    </div>
    
    <div class="section">
        <h2>2. Test Lecture (READ)</h2>
        <button onclick="testRead()">Tester la lecture</button>
        <div id="read-result"></div>
    </div>
    
    <div class="section">
        <h2>3. Test Écriture (CREATE)</h2>
        <button onclick="testCreate()">Tester l'écriture</button>
        <div id="create-result"></div>
    </div>
    
    <div class="section">
        <h2>4. Test avec collection différente</h2>
        <button onclick="testOtherCollection()">Tester avec collection "test"</button>
        <div id="other-result"></div>
    </div>
    
    <div class="section">
        <h2>5. Diagnostic complet</h2>
        <button onclick="runFullDiagnostic()">Lancer le diagnostic complet</button>
        <div id="diagnostic-result"></div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCeZAZ6wQDqZ7ttzAt6VtvON5DDl1M5HSM",
            authDomain: "oscar-baer.firebaseapp.com",
            projectId: "oscar-baer",
            storageBucket: "oscar-baer.firebasestorage.app",
            messagingSenderId: "419618942184",
            appId: "1:419618942184:web:60e8e58c6c3348a3fbad5d"
        };
        
        let app, db;
        
        function initFirebase() {
            if (!app) {
                app = firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            }
            return { app, db };
        }
        
        function log(elementId, message, type = 'info') {
            const div = document.getElementById(elementId);
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'info';
            div.innerHTML = `<div class="${className}">${message}</div>`;
        }
        
        function checkFirebaseInfo() {
            initFirebase();
            const projectId = app.options.projectId;
            const apiKey = app.options.apiKey;
            
            let message = `<strong>Informations Firebase:</strong><br>`;
            message += `Project ID: <code>${projectId}</code><br>`;
            message += `API Key: <code>${apiKey.substring(0, 20)}...</code><br>`;
            message += `Firestore disponible: ${db ? '✅ Oui' : '❌ Non'}<br><br>`;
            
            if (projectId !== 'oscar-baer') {
                message += `<strong class="error">❌ PROBLÈME: Project ID incorrect!</strong><br>`;
                message += `Attendu: <code>oscar-baer</code><br>`;
                message += `Reçu: <code>${projectId}</code><br>`;
                message += `C'est probablement la cause du problème!`;
                log('info-result', message, 'error');
            } else {
                message += `<strong class="success">✅ Project ID correct</strong>`;
                log('info-result', message, 'success');
            }
        }
        
        async function testRead() {
            initFirebase();
            try {
                const snapshot = await db.collection('leaderboard').limit(1).get();
                log('read-result', `✅ Lecture OK - ${snapshot.size} document(s) trouvé(s)`, 'success');
            } catch (error) {
                let message = `❌ Erreur lecture: ${error.code} - ${error.message}<br><br>`;
                if (error.code === 'permission-denied') {
                    message += `<strong>🔒 PERMISSION DENIED</strong><br><br>`;
                    message += `Vérifications à faire:<br>`;
                    message += `1. Les règles sont-elles publiées dans Firebase Console?<br>`;
                    message += `2. Avez-vous attendu 20 secondes après publication?<br>`;
                    message += `3. Y a-t-il une erreur de syntaxe dans les règles?<br>`;
                    message += `4. Le Project ID est-il correct? (voir test 1)<br>`;
                    message += `5. Firestore est-il activé?<br><br>`;
                    message += `Voir: DIAGNOSTIC_COMPLET_PERMISSIONS.md`;
                }
                log('read-result', message, 'error');
            }
        }
        
        async function testCreate() {
            initFirebase();
            try {
                const testData = {
                    name: 'Test Diagnostic',
                    score: Math.floor(Math.random() * 10000),
                    level: 1,
                    date: firebase.firestore.Timestamp.now()
                };
                
                const docRef = await db.collection('leaderboard').add(testData);
                log('create-result', `✅ Écriture OK - Document créé: ${docRef.id}`, 'success');
                
                // Supprimer après 2 secondes
                setTimeout(() => {
                    docRef.delete().catch(() => {});
                }, 2000);
            } catch (error) {
                let message = `❌ Erreur écriture: ${error.code} - ${error.message}<br><br>`;
                if (error.code === 'permission-denied') {
                    message += `<strong>🔒 PERMISSION DENIED</strong><br><br>`;
                    message += `Les règles Firestore bloquent l'écriture.<br><br>`;
                    message += `Vérifiez dans Firebase Console:<br>`;
                    message += `1. Firestore Database → Rules<br>`;
                    message += `2. Les règles doivent contenir: <code>allow create: if true;</code><br>`;
                    message += `3. Cliquez sur "Publier"<br>`;
                    message += `4. Attendez 20 secondes<br><br>`;
                    message += `Si les règles sont correctes, voir: DIAGNOSTIC_COMPLET_PERMISSIONS.md`;
                }
                log('create-result', message, 'error');
            }
        }
        
        async function testOtherCollection() {
            initFirebase();
            try {
                const docRef = await db.collection('test').add({ test: 'value', timestamp: firebase.firestore.Timestamp.now() });
                log('other-result', `✅ Écriture OK avec collection "test" - Document: ${docRef.id}<br><br>Si ça marche avec "test" mais pas avec "leaderboard", le problème vient du nom de collection.`, 'success');
                
                setTimeout(() => {
                    docRef.delete().catch(() => {});
                }, 2000);
            } catch (error) {
                log('other-result', `❌ Erreur avec collection "test": ${error.code} - ${error.message}<br><br>Le problème n'est pas lié au nom de collection.`, 'error');
            }
        }
        
        async function runFullDiagnostic() {
            const resultDiv = document.getElementById('diagnostic-result');
            resultDiv.innerHTML = '<div class="info">⏳ Diagnostic en cours...</div>';
            
            let results = [];
            
            // 1. Vérifier Firebase
            initFirebase();
            const projectId = app.options.projectId;
            results.push(`1. Project ID: ${projectId === 'oscar-baer' ? '✅ Correct' : '❌ Incorrect (' + projectId + ')'}`);
            
            // 2. Test lecture
            try {
                await db.collection('leaderboard').limit(1).get();
                results.push('2. Lecture: ✅ OK');
            } catch (error) {
                results.push(`2. Lecture: ❌ ${error.code} - ${error.message}`);
            }
            
            // 3. Test écriture
            try {
                const docRef = await db.collection('leaderboard').add({
                    name: 'Diagnostic',
                    score: 999,
                    level: 1,
                    date: firebase.firestore.Timestamp.now()
                });
                results.push('3. Écriture: ✅ OK');
                setTimeout(() => docRef.delete().catch(() => {}), 2000);
            } catch (error) {
                results.push(`3. Écriture: ❌ ${error.code} - ${error.message}`);
            }
            
            // 4. Test collection différente
            try {
                const docRef = await db.collection('test').add({ test: 'value' });
                results.push('4. Collection "test": ✅ OK');
                setTimeout(() => docRef.delete().catch(() => {}), 2000);
            } catch (error) {
                results.push(`4. Collection "test": ❌ ${error.code}`);
            }
            
            // Afficher résultats
            let message = '<strong>Résultats du diagnostic:</strong><br><br>';
            results.forEach(r => {
                message += r + '<br>';
            });
            
            message += '<br><strong>Recommandations:</strong><br>';
            if (projectId !== 'oscar-baer') {
                message += '❌ Corrigez le Project ID dans le code<br>';
            }
            if (results.some(r => r.includes('permission-denied'))) {
                message += '❌ Vérifiez les règles Firestore dans Firebase Console<br>';
                message += '   Voir: DIAGNOSTIC_COMPLET_PERMISSIONS.md<br>';
            }
            if (results.every(r => r.includes('✅'))) {
                message += '✅ Tout fonctionne correctement!';
            }
            
            resultDiv.innerHTML = message;
        }
        
        // Auto-initialiser
        window.addEventListener('load', () => {
            if (typeof firebase !== 'undefined') {
                initFirebase();
            }
        });
    </script>
</body>
</html>
